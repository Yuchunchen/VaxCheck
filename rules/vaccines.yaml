codeLists:
  # --- 疾管署官方 IPD 高風險 ICD 參考表(逐碼,ICD-10-CM 2023)---
  IPD_SPLEEN_DX:     { label: 脾臟功能缺損, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#spleen }
  IPD_IMMUNE_DX:     { label: 先天或後天免疫功能不全, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#immune }
  IPD_COCHLEAR_DX:   { label: 人工耳植入, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#cochlear }
  IPD_CSF_LEAK_DX:   { label: 腦脊髓液滲漏, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#csf_leak }
  IPD_MALIGNANCY_DX: { label: 惡性腫瘤, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#malignancy }
  IPD_TRANSPLANT_DX: { label: 器官移植, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#transplant }
  ANTINEOPLASTIC_ATC:
    label: 抗癌藥物(L01;是否含 L02 荷爾蒙療法待 YC 決定)
    system: ATC
    codes: ["L01*"]
  # --- 流感 115 附件1 高風險慢性病人(逐類轉錄;門/住診紀錄 1 筆即可)---
  FLU_CHRONIC_DX:    { label: 高風險慢性病(流感計畫附件1), system: ICD-10-CM, file: codelists/flu-highrisk-chronic.cdc-115.json#chronic }
  # --- 健保重大傷病項目(114-01-01 起,2023 版)— 診斷碼推估,以重大傷病證明為準 ---
  NHI_CATASTROPHIC_DX:      { label: 重大傷病項目診斷碼(推估), system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#general }
  NHI_CATASTROPHIC_1Y_DX:   { label: "重大傷病項目診斷碼(一年內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within365 }
  NHI_CATASTROPHIC_6M_DX:   { label: "重大傷病項目診斷碼(六個月內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within183 }
  NHI_CATASTROPHIC_1M_DX:   { label: "重大傷病項目診斷碼(急性一個月內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within31 }
  # --- 透析(肺鏈 C 案、流感潛在疾病證據共用)---
  DIALYSIS_DX:
    label: 透析相關診斷
    system: ICD-10-CM
    codes: [Z99.2, "Z99.2*", N18.6]

# ---------------------------------------------------------------------
# 人工條件。evidence = 病歷證據;命中則自動勾選、標依據、醫師可取消(docs/10)
# 證據沒命中不代表沒有 → 仍會在「決定性」時詢問
# ---------------------------------------------------------------------
manualConditions:
  - key: indigenous
    label: 具原住民身分
    hint: 戶籍註記為準;健保雲端無此欄位
  - key: pregnant
    label: 孕婦
    askWhen:
      all:
        - sex: F
        - age: { min: { years: 12 }, max: { years: 55 } }
  - key: ltcResident
    label: 長照/安養機構住民或工作人員
  - key: healthcareWorker
    label: 醫事及衛生等單位之防疫相關人員
  # --- 流感 115 年度對象(健保雲端查不到 → 醫師勾選)---
  - key: fluUnderlyingCondition
    label: 具潛在疾病(高風險慢性病、BMI≥30、罕見疾病、重大傷病)
    hint: 高風險慢性病依流感計畫附件1(糖尿病、慢性心肺肝腎疾病、腦血管與神經退化疾病、自體免疫、免疫缺乏/HIV、肥胖症 E66、脾臟缺損等;單純高血壓 I10 不算),有門/住診紀錄即可,無紀錄可經醫師評估。重大傷病以證明為準。BMI≥30、罕見疾病需醫師確認
    evidence:                                    # 病歷命中 → 自動預勾、標依據;醫師可取消
      any:
        - flag: dialysis
        - flag: ckd
        - diagnosis: { $list: DIALYSIS_DX }
        - diagnosis: { $list: FLU_CHRONIC_DX }                        # 附件1,1 筆門/住診紀錄即可
        - diagnosis: { $list: NHI_CATASTROPHIC_DX }                   # 重大傷病:診斷碼推估
        - diagnosis: { $list: NHI_CATASTROPHIC_1Y_DX, withinDays: 365 }
        - diagnosis: { $list: NHI_CATASTROPHIC_6M_DX, withinDays: 183 }
        - diagnosis: { $list: NHI_CATASTROPHIC_1M_DX, withinDays: 31 }
  - key: preschoolChild
    label: 國小入學前幼兒(尚未註冊國小)
    hint: 滿 6 個月(以出生年月日足月計)至國小註冊就學前
    askWhen: { age: { max: { years: 7 } } }
    evidence: { age: { max: { years: 5 } } }     # 未滿 6 歲不可能已入國小 → 自動預勾
  - key: fluStudent
    label: 國小、國中、高中、高職、五專 1–3 年級學生
    hint: 含自學學生;以學籍認定
    askWhen: { age: { min: { years: 6 }, max: { years: 24 } } }
  - key: infantCaregiver
    label: 6 個月內嬰兒之雙親或實際扶養者
  - key: childcareWorker
    label: 幼兒園、托育機構工作人員或居家托育人員(保母)
  - key: animalWorker
    label: 禽畜養殖等相關行業工作人員、動物園工作人員或動物防疫人員
  - key: ipdHighRisk
    label: IPD 高風險對象
    hint: 疾管署定義五類:脾臟功能缺損、先天或後天免疫功能不全、人工耳植入、腦脊髓液滲漏、一年內接受抗癌藥物或放射治療的惡性腫瘤者及器官移植者
    evidence:
      any:
        - diagnosis: { $list: IPD_SPLEEN_DX }
        - diagnosis: { $list: IPD_IMMUNE_DX }
        - diagnosis: { $list: IPD_COCHLEAR_DX }
        - diagnosis: { $list: IPD_CSF_LEAK_DX }
        - all:                                   # 惡性腫瘤:ICD + 一年內抗癌藥(放射治療雲端看不到 → 靠醫師)
            - diagnosis: { $list: IPD_MALIGNANCY_DX }
            - medication: { $list: ANTINEOPLASTIC_ATC, withinDays: 365 }
        - diagnosis: { $list: IPD_TRANSPLANT_DX } # 官方表列 Z94 全章;是否排除皮膚/骨/角膜待 YC 決定
  - key: dialysis
    label: 洗腎患者
    evidence:
      any:
        - flag: dialysis
        - diagnosis: { $list: DIALYSIS_DX }
  - key: declinedPcv13Statement
    label: 曾簽立「無需接種 PCV13 聲明書」
    hint: 視為具自費接種 PCV13 之紀錄,依 CDC Q&A Q10 辦理
  - key: severeAllergyToVaccine
    label: 曾對本疫苗或其成分發生嚴重過敏反應
  - key: acuteFebrileIllness
    label: 目前有急性中重度疾病或發燒

vaccines:
  # =====================================================================
  # 肺炎鏈球菌 PCV20 / PCV21(公費)— 正式轉譯(Canonical Rule A–E、MCB-01~08、S1–S3)
  # =====================================================================
  - vaccineId: PNEUMO_PCV20_21
    name: { zh: 肺炎鏈球菌疫苗 PCV20/PCV21, en: Pneumococcal conjugate vaccine PCV20/PCV21 }
    historyMatch: { vaccineCodes: [PCV20, PCV21] }
    sourceIds: [SRC_PNEUMO_CANONICAL, SRC_CDC_QA_20260810, SRC_CDC_PLAN_20260810, SRC_CDC_LETTER_612]
    notes: 年齡依疾管署算法「接種年 − 出生年」(ageByYear)。

    eligibilityGroups:
      - groupId: PNEUMO_ELDER_65
        label: 65歲以上長者
        criteria: { ageByYear: { min: 65 } }
      - groupId: PNEUMO_INDIGENOUS_55_64
        label: 55–64歲原住民
        criteria:
          all:
            - ageByYear: { min: 55, max: 64 }
            - manual: indigenous
      - groupId: PNEUMO_IPD_19_64
        label: 19–64歲 IPD 高風險對象
        sourceIds: [SRC_CDC_IPD_ICD_1140310]
        criteria:
          all:
            - ageByYear: { min: 19, max: 64 }
            - manual: ipdHighRisk                # 證據(官方 ICD 表)在 manualConditions.ipdHighRisk.evidence

    dosing:
      mode: cases
      unknownTypeCodes: [PNEUMO_UNKNOWN, PCV]
      cases:
        - id: D_PCV20_21_PUBLIC
          label: 已接種公費 PCV20/PCV21
          sourceRef: Rule D / MCB-06
          when: { has: { codes: [PCV20, PCV21], funding: 公費 } }
          then: { action: complete, note: "已完整接種,無需再接種 PCV20/PCV21" }
        - id: S3_SELF_PCV20_21
          label: 自費接種 PCV20/PCV21
          sourceRef: Exception S3 / MCB-08(4)
          when: { has: { codes: [PCV20, PCV21], funding: 自費 } }
          then: { action: give, dose: 1, minInterval: { years: 5 }, intervalFrom: [PCV20, PCV21], note: "醫療上已完整;若仍有公費需求,與前劑間隔至少 5 年,經醫師評估可公費 1 劑" }
        - id: S3_NOT_FUNDED
          label: 自費 PPV23 + 公費 PCV13
          sourceRef: Exception S3 / MCB-08(5)
          when:
            all:
              - has: { codes: [PPV23], funding: 自費 }
              - has: { codes: [PCV13], funding: 公費 }
          then: { action: notFunded, note: "過去已由公費提供 PCV13,不再提供公費 PCV20/PCV21" }
        - id: S3_SELF_PCV_PLUS_PPV
          label: 自費 PCV13/15 + PPV23
          sourceRef: Exception S3 / MCB-08(4)
          when:
            all:
              - has: { codes: [PCV13, PCV15], funding: 自費 }
              - has: [PPV23]
          then: { action: give, dose: 1, minInterval: { years: 5 }, note: "醫療上已完整;若仍有公費需求,與前劑間隔至少 5 年,經醫師評估可公費 1 劑" }
        - id: E_IPD_65_BOOST
          label: IPD 高風險者 65 歲後追加
          sourceRef: Rule E / MCB-06
          when:
            all:
              - has: [PCV13, PCV15]
              - has: [PPV23]
          criteria:
            all:
              - ageByYear: { min: 65 }
              - manual: ipdHighRisk
          then: { action: give, dose: 1, minInterval: { years: 5 }, note: "65歲前已完成 PCV13/15 + PPV23 之 IPD 高風險者,滿 65 歲且與前劑間隔至少 5 年可追加 1 劑" }
        - id: D_PCV_PLUS_PPV
          label: 已接種 PCV13/15 + PPV23
          sourceRef: Rule D / MCB-06
          when:
            all:
              - has: [PCV13, PCV15]
              - has: [PPV23]
          then: { action: complete, note: "一般視為已完整接種,無需再接種 PCV20/PCV21" }
        - id: B_PPV_ONLY
          label: 僅接種 PPV23
          sourceRef: Rule B / MCB-04
          when:
            all:
              - has: [PPV23]
              - none: [PCV13, PCV15, PCV20, PCV21]
          then: { action: give, dose: 1, minInterval: { years: 1 }, intervalFrom: [PPV23], note: "與 PPV23 間隔至少 1 年;IPD 高風險對象亦為 1 年" }
        - id: C_PCV_ONLY_8WK
          label: 僅接種 PCV13/15(特定族群 8 週)
          sourceRef: Rule C / MCB-05
          when:
            all:
              - has: [PCV13, PCV15]
              - none: [PPV23, PCV20, PCV21]
          criteria:
            any:
              - manual: ipdHighRisk
              - all:
                  - ageByYear: { min: 65 }
                  - any:
                      - manual: dialysis
                      - manual: ltcResident
          then: { action: give, dose: 1, minIntervalDays: 56, intervalFrom: [PCV13, PCV15], note: "IPD 高風險、65歲以上機構住民或洗腎患者,與 PCV13/15 間隔至少 8 週" }
        - id: C_PCV_ONLY
          label: 僅接種 PCV13/15
          sourceRef: Rule C / MCB-05
          when:
            all:
              - has: [PCV13, PCV15]
              - none: [PPV23, PCV20, PCV21]
          then: { action: give, dose: 1, minInterval: { years: 1 }, intervalFrom: [PCV13, PCV15], note: "與前劑間隔至少 1 年" }
        - id: S_DECLINED_PCV13
          label: 曾簽立無需接種 PCV13 聲明書
          sourceRef: MCB-08(2)
          when: { none: [PCV13, PCV15, PCV20, PCV21] }
          criteria: { manual: declinedPcv13Statement }
          then: { action: review, note: "視為具自費接種 PCV13 之紀錄,依 Q10 辦理;請醫師評估" }
        - id: A_NAIVE
          label: 從未接種肺炎鏈球菌疫苗
          sourceRef: Rule A / MCB-03;S1–S2
          when: { none: [PCV13, PCV15, PCV20, PCV21, PPV23] }
          then: { action: give, dose: 1, note: "接種 1 劑 PCV20 或 PCV21;病患自述曾自費接種者,先補登再判定" }

    contraindications:
      - { id: PNEUMO_C_ALLERGY, label: 曾對本疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }

    explain:
      eligible: "{groupLabels};{caseLabel}:{caseReason}"
      eligiblePending: "{groupLabels};接種史未查,下一步依既往肺鏈疫苗史決定"
      ineligible: "{age},不在 65歲以上、55–64歲原住民、19–64歲 IPD 高風險三類公費對象內"
      completed: "{caseLabel}:{caseReason}"
      not_funded: "{caseLabel}:{caseReason}"
      needs_review: "{caseLabel}:{caseReason}"


  # =====================================================================
  # 流感 115 年度(2026–27 季)— 正式轉譯
  # 依據:疾管署 2026-08-25 新聞稿;115 年度流感疫苗接種計畫網頁;公費流感 Q&A;幼兒篇 Q&A
  # 第一階段 2026-10-01 起;第二階段 2026-11-02 起(50–64 歲無高風險慢性病成人),至疫苗用罄止
  # 年齡:65 歲、55 歲原住民、50–64 歲依「接種年減出生年」(ageByYear;臺北市衛生局 Q&A,待計畫全文核對)
  # 幼兒:以出生年月日足月計(age)
  # 加強型流感疫苗(優先給機構內 65 歲以上長者)屬廠牌選擇,不影響資格,本規則不判定
  # =====================================================================
  - vaccineId: FLU
    name: { zh: 流感疫苗(115 年度公費), en: Seasonal influenza vaccine 2026–27 (publicly funded) }
    historyMatch: { vaccineCodes: [FLU] }
    season:
      start: "2026-10-01"
      end: "2027-06-30"          # 技術邊界(非公告日期;公告為「至疫苗用罄止」),用於本季劑數計算與季末判定
      phases:
        - { phase: 1, start: "2026-10-01", label: 第一階段 }
        - { phase: 2, start: "2026-11-02", label: 第二階段 }
    sourceIds: [SRC_CDC_FLU_PR_20260825, SRC_CDC_FLU_PLAN_115, SRC_CDC_FLU_QA_115]
    notes: 第一階段 11 類對象;第二階段 50–64 歲無高風險慢性病成人。潛在疾病證據用附件1 ICD 與重大傷病 ICD(推估)。

    eligibilityGroups:
      # ---------- 第一階段(2026-10-01 起)----------
      - groupId: FLU_HCW
        label: 醫事及衛生等單位之防疫相關人員
        priorityPhase: 1
        criteria: { manual: healthcareWorker }
      - groupId: FLU_ELDER_65
        label: 65 歲以上長者
        priorityPhase: 1
        criteria: { ageByYear: { min: 65 } }
      - groupId: FLU_INDIGENOUS_55
        label: 55 歲以上原住民
        priorityPhase: 1
        criteria:
          all:
            - ageByYear: { min: 55 }
            - manual: indigenous
      - groupId: FLU_LTC
        label: 安養、長期照顧(服務)等機構之受照顧者及所屬工作人員
        priorityPhase: 1
        criteria: { manual: ltcResident }
      - groupId: FLU_PRESCHOOL
        label: 滿 6 個月以上至國小入學前幼兒
        priorityPhase: 1
        sourceIds: [SRC_CDC_FLU_QA_CHILD]
        criteria:
          all:
            - age: { min: { months: 6 } }        # 足月計,無寬限期(幼兒篇 Q&A)
            - manual: preschoolChild
      - groupId: FLU_PREGNANT
        label: 孕婦
        priorityPhase: 1
        criteria: { manual: pregnant }
      - groupId: FLU_UNDERLYING_19_64
        label: 19–64 歲具潛在疾病者(高風險慢性病、BMI≥30、罕見疾病、重大傷病)
        priorityPhase: 1
        sourceIds: [SRC_CDC_FLU_ANNEX1_115, SRC_NHI_CATASTROPHIC_1140101]
        criteria:
          all:
            - ageByYear: { min: 19, max: 64 }    # 18 歲以下多已涵蓋於幼兒/學生;年齡算法待計畫全文核對
            - manual: fluUnderlyingCondition
      - groupId: FLU_INFANT_CAREGIVER
        label: 6 個月內嬰兒之雙親或實際扶養者
        priorityPhase: 1
        criteria: { manual: infantCaregiver }
      - groupId: FLU_CHILDCARE_STAFF
        label: 幼兒園、托育機構工作人員及居家托育人員(保母)
        priorityPhase: 1
        criteria: { manual: childcareWorker }
      - groupId: FLU_STUDENT
        label: 國小、國中、高中、高職、五專 1–3 年級學生
        priorityPhase: 1
        criteria: { manual: fluStudent }
      - groupId: FLU_ANIMAL
        label: 禽畜養殖等相關行業工作人員、動物園工作人員及動物防疫人員
        priorityPhase: 1
        criteria: { manual: animalWorker }
      # ---------- 第二階段(2026-11-02 起)----------
      - groupId: FLU_ADULT_50_64
        label: 50–64 歲成人(無高風險慢性病者第二階段)
        priorityPhase: 2
        criteria: { ageByYear: { min: 50, max: 64 } }

    dosing:
      seasonal: true
      # 劑次(幼兒篇 Q&A):年齡以本季第 1 劑接種時計;過去接種史 = 本季前累計劑數,不限同一季
      #   未滿 3 歲:累計 0–1 劑 → 本季 2 劑;累計 ≥2 劑 → 1 劑
      #   3 至未滿 9 歲:累計 0 劑 → 本季 2 劑;累計 ≥1 劑 → 1 劑
      #   9 歲以上:1 劑
      variants:
        - id: FLU_UNDER3_2DOSE
          label: 未滿 3 歲、過去累計未滿 2 劑
          sourceRef: SRC_CDC_FLU_QA_CHILD
          age: { max: { years: 2 } }
          priorDoses: { max: 1 }
          series:
            - { dose: 1, minAge: { months: 6 } }
            - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
        - id: FLU_3TO8_NAIVE_2DOSE
          label: 3 至未滿 9 歲、首次接種
          sourceRef: SRC_CDC_FLU_QA_CHILD
          age: { min: { years: 3 }, max: { years: 8 } }
          priorDoses: { max: 0 }
          series:
            - { dose: 1 }
            - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
      series:
        - { dose: 1, minAge: { months: 6 } }

    contraindications:
      - { id: FLU_C_ALLERGY, label: 曾對流感疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }
      - { id: FLU_C_FEVER, label: "急性中重度疾病或發燒,建議延後", severity: precaution, manual: acuteFebrileIllness }

    explain:
      eligible: "符合「{groupLabels}」,本季可打第 {nextDose} 劑(本季共 {dosesRequired} 劑)"
      eligiblePending: "符合「{groupLabels}」;接種史未查,本季是否已打待確認"
      ineligible: "{age},不在 115 年度公費流感對象內"
      completed: "本季已完成(最近一劑 {lastDate})"
      needs_review: "{caseReason}"
