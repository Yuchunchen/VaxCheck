codeLists:
  # --- 疾管署官方 IPD 高風險 ICD 參考表(逐碼,ICD-10-CM 2023)---
  IPD_SPLEEN_DX:     { label: 脾臟功能缺損, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#spleen }
  IPD_IMMUNE_DX:     { label: 先天或後天免疫功能不全, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#immune }
  IPD_COCHLEAR_DX:   { label: 人工耳植入, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#cochlear }
  IPD_CSF_LEAK_DX:   { label: 腦脊髓液滲漏, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#csf_leak }
  IPD_MALIGNANCY_DX: { label: 惡性腫瘤, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#malignancy }
  IPD_TRANSPLANT_DX: { label: 器官移植, system: ICD-10-CM, file: codelists/ipd-highrisk.cdc-1140310.json#transplant }
  ANTINEOPLASTIC_ATC:                             # IPD 惡性腫瘤「一年內接受抗癌藥物」;YC 2026-09-28 決定含 L02(通函「任何治療癌症之藥物」)
    label: 抗癌藥物(L01 抗腫瘤藥、L02 內分泌治療)
    system: ATC
    codes: ["L01*", "L02*"]
  COVID_CANCER_TX_ATC:                            # COVID 計畫原文為「接受免疫抑制治療之癌症患者」;L02 荷爾蒙療法非免疫抑制,不列
    label: 抗腫瘤藥物(L01;COVID 免疫低下證據用)
    system: ATC
    codes: ["L01*"]
  # --- 流感 115 附件1 高風險慢性病人(逐類轉錄;門/住診紀錄 1 筆即可)---
  FLU_CHRONIC_DX:    { label: 高風險慢性病(流感計畫附件1), system: ICD-10-CM, file: codelists/flu-highrisk-chronic.cdc-115.json#chronic, threeCharAsCategory: true, category: chronic }   # 附件1 的 E66、I63 等為類目(v0.4.5 前誤作完整碼,漏 E66.01、I63.9)
  # --- 健保重大傷病項目(114-01-01 起,2023 版)— 診斷碼推估,以重大傷病證明為準 ---
  NHI_CATASTROPHIC_DX:      { label: 重大傷病項目診斷碼(推估), system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#general, category: catastrophic, validity: 長期, evidenceNote: "診斷碼推估,以證明為準" }
  NHI_CATASTROPHIC_1Y_DX:   { label: "重大傷病項目診斷碼(一年內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within365, category: catastrophic, validity: 一年, evidenceNote: "診斷碼推估,以證明為準" }
  NHI_CATASTROPHIC_6M_DX:   { label: "重大傷病項目診斷碼(六個月內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within183, category: catastrophic, validity: 六個月, evidenceNote: "診斷碼推估,以證明為準" }
  NHI_CATASTROPHIC_1M_DX:   { label: "重大傷病項目診斷碼(急性一個月內,推估)", system: ICD-10-CM, file: codelists/catastrophic-illness.nhi-1140101.json#within31, category: catastrophic, validity: 一個月, evidenceNote: "診斷碼推估,以證明為準" }
  # --- COVID-19 計畫第二章壹五(二):結核病、失能、精神疾病、失智症「經醫師評估」— 病歷證據只預勾,醫師可取消 ---
  # 計畫未附代碼表;以下為 Claude 依病名轉錄(ICD-10-CM),YC 2026-09-28 核准
  COVID_TB_DX:
    label: 結核病(一年內)
    system: ICD-10-CM
    codes: [A15-A19]                              # 活動性結核;潛伏結核 R76.1/Z22.7 不列
  COVID_DISABILITY_DX:
    label: 失能(注意力不足過動症、腦性麻痺、先天性缺陷、發展或學習障礙、脊髓損傷)
    system: ICD-10-CM
    codes:
      - "F90*"                                    # 注意力不足及過動症
      - "G80*"                                    # 腦性麻痺
      - Q00-Q07                                   # 先天性缺陷:只列神經、心血管、呼吸、泌尿、骨骼發育不良、染色體(排除舌繫帶、隱睪等輕微畸形)
      - Q20-Q28
      - Q30-Q34
      - Q60-Q64
      - Q77-Q78
      - Q90-Q99
      - F70-F79                                   # 智能障礙(發展障礙)
      - F80-F89                                   # 語言、學習、動作協調、自閉症等發展障礙
      - S14.0-S14.1                               # 脊髓損傷(頸、胸、腰)
      - S24.0-S24.1
      - S34.0-S34.1
      - "G82*"                                    # 下身/四肢癱瘓
  COVID_PSYCH_DX:
    label: 精神疾病(情緒障礙、思覺失調症)
    system: ICD-10-CM
    codes: [F30-F39, "F20*", "F25*"]                    # 思覺失調症 F20/F25 同重大傷病六(四)
  COVID_DEMENTIA_DX:
    label: 失智症
    system: ICD-10-CM
    codes: [F01-F03, "G30*", "G31.0*", G31.83]
  # --- COVID-19 計畫第二章貳:免疫不全或免疫低下(可再增加 1 劑)---
  IMMUNOSUPPRESSANT_ATC:
    label: 免疫抑制劑(L04A:含 TNF 阻斷劑、移植用藥、其他免疫抑制/調節生物製劑)
    system: ATC
    codes: ["L04A*"]
  HIV_DX:
    label: 人類免疫缺乏病毒感染
    system: ICD-10-CM
    codes: [B20, Z21]
  # --- 國健署公告罕見疾病(115-07-23;v0.4.24 起由 scripts/build-rare-disease.mjs 自 PDF 產生)— 診斷碼推估,以健保卡註記或證明為準 ---
  # broadEvidence: display-only:JSON 頂層 broadCodes(34 碼,YC 核可)命中時只顯示證據、不預勾,證據列標「寬泛碼,需核對」;組合碼成分 E74.31 不納入(見 JSON excluded)
  RARE_DISEASE_DX:   { label: "罕見疾病(國健署公告名單,推估)", system: ICD-10-CM, file: codelists/rare-disease.hpa-1150723.json#rare, category: rare, evidenceNote: "診斷碼推估,以證明為準", broadEvidence: display-only }
  # --- 幼童肺炎鏈球菌高危險群(v0.4.28;codelists/pcv13-child-highrisk.cdc.json 由 scripts/build-pcv13-child-codelist.mjs 自原表產生)---
  # 原表多為 3 碼類目(ICD-10-CM 2015)→ threeCharAsCategory 展開為其下所有細碼;人工耳植入原表只有處置碼 → 證據沿用成人 IPD_COCHLEAR_DX
  PCV_CHILD_SPLEEN_DX:     { label: 脾臟功能缺損(幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#spleen, threeCharAsCategory: true }
  PCV_CHILD_IMMUNE_DX:     { label: 先天或後天免疫功能不全(幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#immune, threeCharAsCategory: true }
  PCV_CHILD_CHRONIC_DX:    { label: 慢性疾病(慢性腎病變、先天發紺性心臟病、慢性肺臟病、糖尿病;幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#chronic, threeCharAsCategory: true }
  PCV_CHILD_CSF_LEAK_DX:   { label: 腦脊髓液滲漏(幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#csf_leak, threeCharAsCategory: true }
  PCV_CHILD_MALIGNANCY_DX: { label: 惡性腫瘤(重大傷病類別 01;幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#malignancy, threeCharAsCategory: true }
  PCV_CHILD_TRANSPLANT_DX: { label: 器官移植(幼童肺鏈高危險群), system: ICD-10-CM, file: codelists/pcv13-child-highrisk.cdc.json#transplant, threeCharAsCategory: true }
  # --- 透析(肺鏈 C 案、流感潛在疾病證據共用)---
  DIALYSIS_DX:
    label: 透析相關診斷
    system: ICD-10-CM
    codes: [Z99.2, "Z99.2*", N18.6]

# ---------------------------------------------------------------------
# 人工條件。evidence = 病歷證據;命中則自動勾選、標依據、醫師可取消(docs/10)
# 證據沒命中不代表沒有 → 仍會在「決定性」時詢問
# ---------------------------------------------------------------------
manualConditions:
  - key: indigenous
    label: 具原住民身分
    hint: 戶籍註記為準;健保雲端無此欄位
  - key: pregnant
    label: 孕婦
    askWhen:
      all:
        - sex: F
        - age: { min: { years: 12 }, max: { years: 55 } }
  - key: ltcResident
    label: 長照/安養機構住民或工作人員
  - key: healthcareWorker
    label: 醫事及衛生等單位之防疫相關人員
  # --- 流感 115 年度對象(健保雲端查不到 → 醫師勾選)---
  - key: fluUnderlyingCondition
    label: 具潛在疾病(高風險慢性病、BMI≥30、罕見疾病、重大傷病)
    hint: 高風險慢性病依流感計畫附件1(糖尿病、慢性心肺肝腎疾病、腦血管與神經退化疾病、自體免疫、免疫缺乏/HIV、肥胖症 E66、脾臟缺損等;單純高血壓 I10 不算),有門/住診紀錄即可,無紀錄可經醫師評估。重大傷病、罕見疾病以健保卡註記或證明為準(病歷診斷碼僅推估預勾;罕見疾病名單中的寬泛碼只列出、需核對,不預勾)。BMI≥30 需醫師確認
    evidence:                                    # 病歷命中 → 自動預勾、標依據;醫師可取消
      any:
        - flag: dialysis
        - flag: ckd
        - diagnosis: { $list: DIALYSIS_DX }
        - diagnosis: { $list: FLU_CHRONIC_DX }                        # 附件1,1 筆門/住診紀錄即可
        - diagnosis: { $list: NHI_CATASTROPHIC_DX }                   # 重大傷病:診斷碼推估
        - diagnosis: { $list: NHI_CATASTROPHIC_1Y_DX, withinDays: 365 }
        - diagnosis: { $list: NHI_CATASTROPHIC_6M_DX, withinDays: 183 }
        - diagnosis: { $list: NHI_CATASTROPHIC_1M_DX, withinDays: 31 }
        - diagnosis: { $list: RARE_DISEASE_DX }                       # 罕見疾病:診斷碼推估(YC 2026-09-27 決定採用)
  - key: preschoolChild
    label: 國小入學前幼兒(尚未註冊國小)
    hint: 滿 6 個月(以出生年月日足月計)至國小註冊就學前
    askWhen: { age: { max: { years: 7 } } }
    evidence: { age: { max: { years: 5 } } }     # 未滿 6 歲不可能已入國小 → 自動預勾
  - key: fluStudent
    label: 國小、國中、高中、高職、五專 1–3 年級學生
    hint: 含自學學生;以學籍認定
    askWhen: { age: { min: { years: 6 }, max: { years: 24 } } }
  - key: infantCaregiver
    label: 6 個月內嬰兒之雙親或實際扶養者
  - key: childcareWorker
    label: 幼兒園、托育機構工作人員或居家托育人員(保母)
  - key: animalWorker
    label: 禽畜養殖等相關行業工作人員、動物園工作人員或動物防疫人員
  # --- COVID-19 115–116 年度 ---
  - key: covidOtherRisk
    label: 結核病、失能、精神疾病或失智症(經醫師評估)
    hint: 計畫第二章壹五(二):結核病、失能(注意力不足及過動症、腦性麻痺、先天性缺陷、發展或學習障礙、脊髓損傷)、精神疾病(情緒障礙、思覺失調症)、失智症之患者,經醫師評估符合者
    evidence:
      any:
        - diagnosis: { $list: COVID_TB_DX, withinDays: 365 }
        - diagnosis: { $list: COVID_DISABILITY_DX }
        - diagnosis: { $list: COVID_PSYCH_DX }
        - diagnosis: { $list: COVID_DEMENTIA_DX }
  - key: covidImmunocompromised
    label: 免疫不全或免疫低下(COVID-19 可再增加 1 劑)
    hint: 計畫第二章貳:目前或 1 年內曾接受免疫抑制治療之癌症患者、器官/幹細胞移植、中度/嚴重先天性免疫不全、洗腎、HIV、目前使用高度免疫抑制藥物(含高劑量類固醇)、6 個月內化療或放療、其他經醫師評估者
    evidence:
      any:
        - diagnosis: { $list: HIV_DX }
        - diagnosis: { $list: IPD_IMMUNE_DX }                          # 疾管署官方 IPD 免疫不全表(含先天性免疫不全)
        - diagnosis: { $list: IPD_TRANSPLANT_DX }
        - flag: dialysis
        - diagnosis: { $list: DIALYSIS_DX }
        - all:                                                         # 癌症 + 一年內抗腫瘤藥(L01;不含 L02)
            - diagnosis: { $list: IPD_MALIGNANCY_DX }
            - medication: { $list: COVID_CANCER_TX_ATC, withinDays: 365 }
        - medication: { $list: IMMUNOSUPPRESSANT_ATC, withinDays: 90 }  # 「目前使用」以 90 天內處方推估;高劑量類固醇雲端無法判劑量 → 靠醫師
  - key: ipdHighRisk
    label: IPD 高風險對象
    hint: 疾管署定義五類:脾臟功能缺損、先天或後天免疫功能不全、人工耳植入、腦脊髓液滲漏、一年內接受抗癌藥物或放射治療的惡性腫瘤者及器官移植者
    evidence:
      any:
        - diagnosis: { $list: IPD_SPLEEN_DX }
        - diagnosis: { $list: IPD_IMMUNE_DX }
        - diagnosis: { $list: IPD_COCHLEAR_DX }
        - diagnosis: { $list: IPD_CSF_LEAK_DX }
        - all:                                   # 惡性腫瘤:ICD + 一年內抗癌藥(放射治療雲端看不到 → 靠醫師)
            - diagnosis: { $list: IPD_MALIGNANCY_DX }
            - medication: { $list: ANTINEOPLASTIC_ATC, withinDays: 365 }
        - diagnosis: { $list: IPD_TRANSPLANT_DX } # 官方表列 Z94 全章,含皮膚/骨/角膜(YC 2026-09-28 決定不排除)
  - key: pcvChildHighRisk
    label: 肺炎鏈球菌高危險群幼童
    hint: 接種原則備註3、Q&A Q6 六大類:脾臟功能缺損;先天或後天免疫功能不全(含愛滋病毒感染者);人工耳植入;慢性疾病(慢性腎病變含腎病症候群、先天發紺性心臟病含心臟衰竭、慢性肺臟病〔氣喘除外〕、糖尿病);腦脊髓液滲漏;接受免疫抑制劑或放射治療的惡性腫瘤及器官移植。請家長出具診斷書等證明(Q&A Q9);病歷診斷碼僅推估預勾
    askWhen: { age: { max: { years: 4 } } }
    evidence:
      any:
        - diagnosis: { $list: PCV_CHILD_SPLEEN_DX }
        - diagnosis: { $list: PCV_CHILD_IMMUNE_DX }
        - diagnosis: { $list: IPD_COCHLEAR_DX }                   # 幼童表只列處置碼;沿用成人 IPD 表人工耳診斷碼
        - diagnosis: { $list: PCV_CHILD_CHRONIC_DX }
        - diagnosis: { $list: PCV_CHILD_CSF_LEAK_DX }
        - all:                                                     # 惡性腫瘤:ICD + 一年內抗癌藥(放射治療雲端看不到 → 靠醫師;同成人 IPD)
            - diagnosis: { $list: PCV_CHILD_MALIGNANCY_DX }
            - medication: { $list: ANTINEOPLASTIC_ATC, withinDays: 365 }
        - diagnosis: { $list: PCV_CHILD_TRANSPLANT_DX }
  - key: dialysis
    label: 洗腎患者
    evidence:
      any:
        - flag: dialysis
        - diagnosis: { $list: DIALYSIS_DX }
  - key: declinedPcv13Statement
    label: 曾簽立「無需接種 PCV13 聲明書」
    hint: 視為具自費接種 PCV13 之紀錄,依 CDC Q&A Q10 辦理
  - key: severeAllergyToVaccine
    label: 曾對本疫苗或其成分發生嚴重過敏反應
  - key: acuteFebrileIllness
    label: 目前有急性中重度疾病或發燒

vaccines:
  # =====================================================================
  # 肺炎鏈球菌 PCV20 / PCV21(公費)— 正式轉譯(Canonical Rule A–E、MCB-01~08、S1–S3)
  # =====================================================================
  - vaccineId: PNEUMO_PCV20_21
    name: { zh: 肺炎鏈球菌疫苗 PCV20/PCV21, en: Pneumococcal conjugate vaccine PCV20/PCV21 }
    historyMatch: { vaccineCodes: [PCV20, PCV21] }
    sourceIds: [SRC_PNEUMO_CANONICAL, SRC_CDC_QA_20260810, SRC_CDC_PLAN_20260810, SRC_CDC_LETTER_612]
    notes: 年齡依疾管署算法「接種年 − 出生年」(ageByYear)。

    eligibilityGroups:
      - groupId: PNEUMO_ELDER_65
        label: 65歲以上長者
        criteria: { ageByYear: { min: 65 } }
      - groupId: PNEUMO_INDIGENOUS_55_64
        label: 55–64歲原住民
        criteria:
          all:
            - ageByYear: { min: 55, max: 64 }
            - manual: indigenous
      - groupId: PNEUMO_IPD_19_64
        label: 19–64歲 IPD 高風險對象
        sourceIds: [SRC_CDC_IPD_ICD_1140310]
        criteria:
          all:
            - ageByYear: { min: 19, max: 64 }
            - manual: ipdHighRisk                # 證據(官方 ICD 表)在 manualConditions.ipdHighRisk.evidence

    dosing:
      mode: cases
      unknownTypeCodes: [PNEUMO_UNKNOWN, PCV]
      cases:
        - id: D_PCV20_21_PUBLIC
          label: 已接種公費 PCV20/PCV21
          sourceRef: Rule D / MCB-06
          when: { has: { codes: [PCV20, PCV21], funding: 公費 } }
          then: { action: complete, note: "已完整接種,無需再接種 PCV20/PCV21" }
        - id: S3_SELF_PCV20_21
          label: 自費接種 PCV20/PCV21
          sourceRef: Exception S3 / MCB-08(4)
          when: { has: { codes: [PCV20, PCV21], funding: 自費 } }
          then: { action: give, dose: 1, minInterval: { years: 5 }, intervalFrom: [PCV20, PCV21], note: "醫療上已完整;若仍有公費需求,與前劑間隔至少 5 年,經醫師評估可公費 1 劑" }
        - id: S3_NOT_FUNDED
          label: 自費 PPV23 + 公費 PCV13
          sourceRef: Exception S3 / MCB-08(5)
          when:
            all:
              - has: { codes: [PPV23], funding: 自費 }
              - has: { codes: [PCV13], funding: 公費 }
          then: { action: notFunded, note: "過去已由公費提供 PCV13,不再提供公費 PCV20/PCV21" }
        - id: S3_SELF_PCV_PLUS_PPV
          label: 自費 PCV13/15 + PPV23
          sourceRef: Exception S3 / MCB-08(4)
          when:
            all:
              - has: { codes: [PCV13, PCV15], funding: 自費 }
              - has: [PPV23]
          then: { action: give, dose: 1, minInterval: { years: 5 }, note: "醫療上已完整;若仍有公費需求,與前劑間隔至少 5 年,經醫師評估可公費 1 劑" }
        - id: E_IPD_65_BOOST
          label: IPD 高風險者 65 歲後追加
          sourceRef: Rule E / MCB-06
          when:
            all:
              - has: [PCV13, PCV15]
              - has: [PPV23]
          criteria:
            all:
              - ageByYear: { min: 65 }
              - manual: ipdHighRisk
          then: { action: give, dose: 1, minInterval: { years: 5 }, note: "65歲前已完成 PCV13/15 + PPV23 之 IPD 高風險者,滿 65 歲且與前劑間隔至少 5 年可追加 1 劑" }
        - id: D_PCV_PLUS_PPV
          label: 已接種 PCV13/15 + PPV23
          sourceRef: Rule D / MCB-06
          when:
            all:
              - has: [PCV13, PCV15]
              - has: [PPV23]
          then: { action: complete, note: "一般視為已完整接種,無需再接種 PCV20/PCV21" }
        - id: B_PPV_ONLY
          label: 僅接種 PPV23
          sourceRef: Rule B / MCB-04
          when:
            all:
              - has: [PPV23]
              - none: [PCV13, PCV15, PCV20, PCV21]
          then: { action: give, dose: 1, minInterval: { years: 1 }, intervalFrom: [PPV23], note: "與 PPV23 間隔至少 1 年;IPD 高風險對象亦為 1 年" }
        - id: C_PCV_ONLY_8WK
          label: 僅接種 PCV13/15(特定族群 8 週)
          sourceRef: Rule C / MCB-05
          when:
            all:
              - has: [PCV13, PCV15]
              - none: [PPV23, PCV20, PCV21]
          criteria:
            any:
              - manual: ipdHighRisk
              - all:
                  - ageByYear: { min: 65 }
                  - any:
                      - manual: dialysis
                      - manual: ltcResident
          then: { action: give, dose: 1, minIntervalDays: 56, intervalFrom: [PCV13, PCV15], note: "IPD 高風險、65歲以上機構住民或洗腎患者,與 PCV13/15 間隔至少 8 週" }
        - id: C_PCV_ONLY
          label: 僅接種 PCV13/15
          sourceRef: Rule C / MCB-05
          when:
            all:
              - has: [PCV13, PCV15]
              - none: [PPV23, PCV20, PCV21]
          then: { action: give, dose: 1, minInterval: { years: 1 }, intervalFrom: [PCV13, PCV15], note: "與前劑間隔至少 1 年" }
        - id: S_DECLINED_PCV13
          label: 曾簽立無需接種 PCV13 聲明書
          sourceRef: MCB-08(2)
          when: { none: [PCV13, PCV15, PCV20, PCV21] }
          criteria: { manual: declinedPcv13Statement }
          then: { action: review, note: "視為具自費接種 PCV13 之紀錄,依 Q10 辦理;請醫師評估" }
        - id: A_NAIVE
          label: 從未接種肺炎鏈球菌疫苗
          sourceRef: Rule A / MCB-03;S1–S2
          when: { none: [PCV13, PCV15, PCV20, PCV21, PPV23] }
          then: { action: give, dose: 1, note: "接種 1 劑 PCV20 或 PCV21;病患自述曾自費接種者,先補登再判定" }

    contraindications:
      - { id: PNEUMO_C_ALLERGY, label: 曾對本疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }

    explain:
      eligible: "{groupLabels};{caseLabel}:{caseReason}"
      eligiblePending: "{groupLabels};接種史未查,下一步依既往肺鏈疫苗史決定"
      ineligible: "{age},不在 65歲以上、55–64歲原住民、19–64歲 IPD 高風險三類公費對象內"
      completed: "{caseLabel}:{caseReason}"
      not_funded: "{caseLabel}:{caseReason}"
      needs_review: "{caseLabel}:{caseReason}"


  # =====================================================================
  # 幼童 13 價結合型肺炎鏈球菌疫苗 PCV13(5 歲以下公費)— v0.4.28 轉譯
  # 依據:5歲以下幼童公費PCV13接種原則(105年4月修訂)、Q&A(105年4月版)、兒童接種時程(115.09版,仍為 2、4、12–15 個月)
  # 對象(Q&A Q1、原則備註1):出生滿 2 個月至未滿 5 歲(60 個月),未曾接種或尚未完成 PCV13。年齡以出生年月日足月計(age)
  # 劑次:依「目前年齡」(1 歲以下 / 1–2 歲 / 2–5 歲)與「PCV13 已接種劑次及接種當時月齡」逐案判定(接種原則表);
  #   最短間隔(Q&A Q5):1 歲前基礎劑 8 週,第 1 劑於滿 7 個月才開始者與第 2 劑可縮短為 4 週;1 歲後追加劑滿 12 個月以後且與前劑 8 週
  # 高危險群(原則備註3、Q&A Q7):依第 1 劑接種月齡;放在一般原則之前 → 未確認時成為「待確認」升級(只在會改變結果時問)
  # 表未列的組合一律交人工(needs_review),不推估。Q4「特殊狀況最早出生滿 6 週」不自動判定(對象群下限維持 2 個月)
  # 接種原則只依 PCV13 劑次:曾接種 PCV7/10/15/20/21 → 交人工
  # =====================================================================
  - vaccineId: PCV13_CHILD
    name: { zh: 13 價結合型肺炎鏈球菌疫苗 PCV13(5 歲以下幼童公費), en: "Pneumococcal conjugate vaccine PCV13 (publicly funded, children under 5)" }
    historyMatch: { vaccineCodes: [PCV13] }
    sourceIds: [SRC_CDC_PCV13_CHILD_PRINCIPLE_10504, SRC_CDC_PCV13_CHILD_QA_10504, SRC_CDC_CHILD_SCHEDULE_11509]
    notes: 年齡以出生年月日足月計;劑次依目前年齡、PCV13 已接種劑次與接種當時月齡判定。一般兒童常規 3 劑(2、4 個月,滿 12–15 個月追加 1 劑);高危險群依第 1 劑接種月齡增加劑次。

    eligibilityGroups:
      - groupId: PCV13_CHILD_UNDER5
        label: 出生滿 2 個月至未滿 5 歲幼童
        criteria: { age: { min: { months: 2 }, max: { years: 4 } } }   # 足月計;max years 4 = 未滿 5 歲(60 個月)

    dosing:
      mode: cases
      requireDoseDates: true                     # 劑次依接種當時月齡 → 缺生日或接種日期不明 → 人工
      unknownTypeCodes: [PNEUMO_UNKNOWN, PCV]
      cases:
        # ---------- 其他結合型疫苗 ----------
        - id: PC_OTHER_PCV
          label: 曾接種 PCV13 以外之結合型肺鏈疫苗
          sourceRef: 接種原則(105.04)只依 PCV13 接種史
          when: { has: [PCV7, PCV10, PCV15, PCV20, PCV21] }
          then: { action: review, note: "接種史有 PCV7/10/15/20/21;5 歲以下幼童 PCV13 接種原則只依 PCV13 劑次,請醫師評估" }

        # ---------- 高危險群(原則備註3、Q&A Q7)----------
        - id: PC_HR_INF_3RD_PRIMARY
          label: 高危險群(第 1 劑於未滿 7 個月):第 3 劑基礎劑
          sourceRef: 接種原則備註3(1);Q&A Q7(1)
          when:
            all:
              - firstDose: { codes: [PCV13], ageAtDose: { max: { months: 6 } } }
              - doses: { codes: [PCV13], min: 2, max: 2 }
          criteria:
            all:
              - age: { max: { months: 11 } }
              - manual: pcvChildHighRisk
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "高危險群:出生滿 2、4、6 個月各 1 劑共 3 劑(與前 1 劑間隔至少 8 週),滿 12–15 個月再追加 1 劑" }
        - id: PC_HR_INF_LATE_2ND
          label: 高危險群(第 1 劑於滿 7 個月至未滿 12 個月):第 2 劑
          sourceRef: 接種原則備註3(2);Q&A Q7(2)
          when:
            all:
              - firstDose: { codes: [PCV13], ageAtDose: { min: { months: 7 }, max: { months: 11 } } }
              - doses: { codes: [PCV13], min: 1, max: 1 }
          criteria:
            all:
              - age: { max: { months: 11 } }
              - manual: pcvChildHighRisk
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "高危險群:接種 2 劑,兩劑間隔至少 8 週;滿 12–15 個月再追加 1 劑(與前 1 劑間隔至少 8 週)" }
        - id: PC_HR_MISSED_PRIMARY
          label: 高危險群(第 1 劑於未滿 7 個月):1 歲前基礎劑未滿 3 劑
          sourceRef: 接種原則備註3(1)
          when:
            all:
              - firstDose: { codes: [PCV13], ageAtDose: { max: { months: 6 } } }
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 1, max: 2 }
              - doses: { codes: [PCV13], max: 3 }
          criteria:
            all:
              - age: { min: { months: 12 } }
              - manual: pcvChildHighRisk
          then: { action: review, note: "高危險群第 1 劑於未滿 7 個月者,應於出生滿 2、4、6 個月接種 3 劑並於滿 12–15 個月追加 1 劑(共 4 劑);1 歲前基礎劑未滿 3 劑者如何補種,接種原則未明示,請醫師判定" }
        - id: PC_HR_LATE_START_2ND
          label: 高危險群(第 1 劑於滿 12 個月以後):第 2 劑
          sourceRef: 接種原則備註3(3);Q&A Q7(3)
          when:
            all:
              - firstDose: { codes: [PCV13], ageAtDose: { min: { months: 12 } } }
              - doses: { codes: [PCV13], min: 1, max: 1 }
          criteria:
            all:
              - age: { min: { months: 24 } }           # 1–2 歲一般原則同為 2 劑;只在 2–5 歲會改變結果
              - manual: pcvChildHighRisk
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "高危險群(第 1 劑於滿 12 個月以後):應接種 2 劑,2 劑間隔至少 8 週" }
        - id: PC_HR_NAIVE_2Y
          label: 高危險群,滿 2 歲以後從未接種
          sourceRef: 接種原則備註3(3);Q&A Q7(3)
          when: { none: [PCV13] }
          criteria:
            all:
              - age: { min: { months: 24 } }           # 2–5 歲一般原則 1 劑,高危險群 2 劑(今日同為第 1 劑,只差說明)
              - manual: pcvChildHighRisk
          then: { action: give, nextDose: true, intervalFrom: [PCV13], note: "高危險群:應接種 2 劑,2 劑間隔至少 8 週" }

        # ---------- 一般幼童:接種原則表,1 歲以下(滿 2 個月–未滿 12 個月)----------
        - id: PC_INF_NAIVE
          label: 1 歲以下,從未接種
          sourceRef: 接種原則 1歲以下/0劑
          when: { none: [PCV13] }
          criteria: { age: { max: { months: 11 } } }
          then: { action: give, nextDose: true, intervalFrom: [PCV13], note: "公費 3 劑:滿 2 個月後接種第 1 劑,間隔 8 週接種第 2 劑,滿 12–15 個月接種第 3 劑(與前 1 劑至少間隔 8 週)" }
        - id: PC_INF_1_LATE
          label: 1 歲以下,已接種 1 劑(第 1 劑於滿 7 個月以後)
          sourceRef: 接種原則 1歲以下/1劑;Q&A Q5(1)
          when:
            all:
              - doses: { codes: [PCV13], min: 1, max: 1 }
              - firstDose: { codes: [PCV13], ageAtDose: { min: { months: 7 } } }
          criteria: { age: { max: { months: 11 } } }
          then: { action: give, nextDose: true, minIntervalDays: 28, intervalFrom: [PCV13], note: "第 1 劑於出生滿 7 個月才開始:與第 2 劑間隔可縮短為 4 週;滿 12–15 個月再接種 1 劑(與前 1 劑至少間隔 8 週)" }
        - id: PC_INF_1
          label: 1 歲以下,已接種 1 劑
          sourceRef: 接種原則 1歲以下/1劑
          when: { doses: { codes: [PCV13], min: 1, max: 1 } }
          criteria: { age: { max: { months: 11 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 2 劑:接種 1 劑(與前 1 劑至少間隔 8 週),滿 12–15 個月再接種 1 劑(與前 1 劑至少間隔 8 週)" }
        - id: PC_INF_BOOSTER
          label: 1 歲以下,已接種 2–3 劑
          sourceRef: 接種原則 1歲以下/2-3劑
          when: { doses: { codes: [PCV13], min: 2, max: 3 } }
          criteria: { age: { max: { months: 11 } } }
          then: { action: give, nextDose: true, minAge: { months: 12 }, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 1 劑:滿 12–15 個月接種(與前 1 劑至少間隔 8 週)" }

        # ---------- 一般幼童:滿 1 歲–未滿 2 歲 ----------
        - id: PC_TOD_NAIVE
          label: 1–2 歲,從未接種
          sourceRef: 接種原則 滿1歲-未滿2歲/0劑
          when: { none: [PCV13] }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: give, nextDose: true, intervalFrom: [PCV13], note: "公費 2 劑:接種 1 劑,間隔 8 週接種第 2 劑" }
        - id: PC_TOD_B1
          label: 1–2 歲,1 歲前已接種 1 劑
          sourceRef: 接種原則 滿1歲-未滿2歲/1歲前已接種1劑
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 1, max: 1 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, max: 0 }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 2 劑:接種 1 劑(與前 1 劑至少間隔 8 週),間隔 8 週接種第 2 劑" }
        - id: PC_TOD_B1_M1
          label: 1–2 歲,1 歲前 1 劑、滿 1 歲後 1 劑
          sourceRef: 接種原則 滿1歲-未滿2歲/1歲前已接種1劑(公費 2 劑之第 2 劑)
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 1, max: 1 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, min: 1, max: 1 }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "1 歲前已接種 1 劑者滿 1 歲後公費 2 劑之第 2 劑:與前 1 劑至少間隔 8 週" }
        - id: PC_TOD_B0_M1
          label: 1–2 歲,1 歲前未接種、滿 1 歲後已接種 1 劑
          sourceRef: 接種原則 滿1歲-未滿2歲/1歲前未接種,滿1歲後已接種1劑
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, max: 0 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, min: 1, max: 1 }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 1 劑:與前 1 劑至少間隔 8 週" }
        - id: PC_TOD_B2
          label: 1–2 歲,1 歲前已接種 2–3 劑
          sourceRef: 接種原則 滿1歲-未滿2歲/1歲前已接種2-3劑
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 2, max: 3 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, max: 0 }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 1 劑:與前 1 劑至少間隔 8 週" }
        - id: PC_TOD_DONE
          label: 1–2 歲,已依接種原則完成
          sourceRef: 接種原則 滿1歲-未滿2歲(各列公費劑次已接種完畢)
          when:
            any:
              - all:
                  - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, max: 1 }
                  - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, min: 2 }
              - all:
                  - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 2, max: 3 }
                  - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, min: 1 }
          criteria: { age: { min: { months: 12 }, max: { months: 23 } } }
          then: { action: complete, note: "已依接種原則完成,無需再接種" }

        # ---------- 一般幼童:滿 2 歲–未滿 5 歲 ----------
        - id: PC_PRE_AFTER2
          label: 2–5 歲,2 歲以後已接種 1 劑
          sourceRef: 接種原則 滿2歲-未滿5歲/2歲以後接種1劑
          when: { doses: { codes: [PCV13], ageAtDose: { min: { months: 24 } }, min: 1 } }
          criteria: { age: { min: { months: 24 } } }
          then: { action: complete, note: "2 歲以後已接種 1 劑,無需再接種" }
        - id: PC_PRE_NONE_AFTER1
          label: 2–5 歲,1 歲以後未曾接種
          sourceRef: 接種原則 滿2歲-未滿5歲/1歲以後未曾接種(0–3 劑)
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 } }, max: 0 }
              - doses: { codes: [PCV13], max: 3 }
          criteria: { age: { min: { months: 24 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 1 劑(曾接種者與前 1 劑至少間隔 8 週)" }
        - id: PC_PRE_B1_M1
          label: 2–5 歲,1 歲前僅 1 劑且 1–2 歲亦只 1 劑
          sourceRef: 接種原則 滿2歲-未滿5歲/1歲前僅接種1劑且1-2歲亦只接種1劑
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 1, max: 1 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 }, max: { months: 23 } }, min: 1, max: 1 }
          criteria: { age: { min: { months: 24 } } }
          then: { action: give, nextDose: true, minIntervalDays: 56, intervalFrom: [PCV13], note: "公費 1 劑:與前 1 劑至少間隔 8 週" }
        - id: PC_PRE_DONE
          label: 2–5 歲,1–2 歲間已依接種原則完成
          sourceRef: 接種原則 滿1歲-未滿2歲(該年齡層公費劑次已接種完畢)
          when:
            any:
              - all:
                  - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, max: 1 }
                  - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 }, max: { months: 23 } }, min: 2 }
              - all:
                  - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, min: 2, max: 3 }
                  - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 }, max: { months: 23 } }, min: 1 }
          criteria: { age: { min: { months: 24 } } }
          then: { action: complete, note: "1–2 歲間已依接種原則完成,無需再接種" }
        - id: PC_PRE_B0_M1
          label: 2–5 歲,1 歲前未接種、1–2 歲間僅 1 劑
          sourceRef: 接種原則 滿2歲-未滿5歲(表未列)
          when:
            all:
              - doses: { codes: [PCV13], ageAtDose: { max: { months: 11 } }, max: 0 }
              - doses: { codes: [PCV13], ageAtDose: { min: { months: 12 }, max: { months: 23 } }, min: 1, max: 1 }
          criteria: { age: { min: { months: 24 } } }
          then: { action: review, note: "接種原則表未列此情形(1 歲前未接種、1–2 歲間僅接種 1 劑,現已滿 2 歲),請醫師判定" }
        # 其餘組合(例如 1 歲前 4 劑以上)→ 引擎預設「接種史組合未定義,請人工判定」

    contraindications:
      - { id: PCV13_CHILD_C_ALLERGY, label: 曾對本疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }
      - { id: PCV13_CHILD_C_FEVER, label: "急性中重度疾病或發燒,建議延後", severity: precaution, manual: acuteFebrileIllness }

    explain:
      eligible: "{groupLabels};{caseLabel}:{caseReason}"
      eligiblePending: "{groupLabels};接種史未查,劑次依已接種 PCV13 劑數與接種月齡決定"
      ineligible: "{age},不在出生滿 2 個月至未滿 5 歲之幼童公費 PCV13 對象內"
      completed: "{caseLabel}:{caseReason}"
      needs_review: "{caseReason}"


  # =====================================================================
  # 流感 115 年度(2026–27 季)— 正式轉譯
  # 依據:115 年度流感疫苗接種計畫全文(115 年 7 月版);疾管署 2026-08-25 新聞稿;公費流感 Q&A;幼兒篇 Q&A
  # 第一階段 2026-10-01 起;第二階段 2026-11-02 起(50–64 歲無高風險慢性病成人),至疫苗用罄止
  # 年齡:65 歲、55 歲原住民、50–64 歲依「接種年減出生年」(ageByYear;計畫第二章參「50歲以上成人」原文,65/55 為其分階段子群)
  # 幼兒:以出生年月日足月計(age)
  # 加強型流感疫苗(優先給機構內 65 歲以上長者)屬廠牌選擇,不影響資格,本規則不判定
  # =====================================================================
  - vaccineId: FLU
    name: { zh: 流感疫苗(115 年度公費), en: Seasonal influenza vaccine 2026–27 (publicly funded) }
    historyMatch: { vaccineCodes: [FLU] }
    season:
      start: "2026-10-01"
      end: "2027-06-30"          # 技術邊界(非公告日期;公告為「至疫苗用罄止」),用於季末判定(之後未接種者 = 非公費期間)
      historyEnd: "2027-09-30"   # 接種史的季:10/1 起算、隔年 9/30 止(YC 2026-09-30)。10/1 前接種(如 8 月)算上一季;10/1 起接種到 9/30 前都算本季已接種
      phases:
        - { phase: 1, start: "2026-10-01", label: 第一階段 }
        - { phase: 2, start: "2026-11-02", label: 第二階段 }
    sourceIds: [SRC_CDC_FLU_PR_20260825, SRC_CDC_FLU_PLAN_115, SRC_CDC_FLU_QA_115, SRC_CDC_FLU_MANUAL_115]
    reportCodes:                                 # 工作手冊附件14;只供填報顯示,不影響資格
      label: NIIS 接種對象別
      sourceRef: SRC_CDC_FLU_MANUAL_115
      occupationalFirst: true                    # 第四章壹五(四):以職業別為優先填報類別;非職業別之間手冊未定順序 → 依附件14 表列順序
      table:
        - { code: F01,    label: 6 個月以上至國小入學前幼兒 }
        - { code: F02A01, label: 國小學童 }
        - { code: F02A02, label: 國中生 }
        - { code: F02A03, label: 高中/職、五專 1 至 3 年級學生 }
        - { code: F02B,   label: 幼兒園及托育機構工作人員、居家托育人員(保母), occupational: true }
        - { code: F03A,   label: 滿 50 歲以上成人(衛生所或合約院所內), note: 社區/企業接種站/到宅接種改填 F03B }
        - { code: F03B,   label: 滿 50 歲以上成人(社區/企業接種站/到宅接種) }
        - { code: F04A,   label: 安養、長期照顧等機構受照顧者 }
        - { code: F04B,   label: 機構所屬直接照顧工作人員, occupational: true }
        - { code: F05A,   label: 孕婦 }
        - { code: F05B,   label: 6 個月內嬰兒之雙親或實際扶養者 }
        - { code: F06A,   label: 高風險慢性病患 }
        - { code: F06B,   label: 罕見疾病患者 }
        - { code: F06C,   label: 重大傷病患者 }
        - { code: F07A,   label: 具執業登記之醫事人員, occupational: true }
        - { code: F07B,   label: 醫療院所非執登工作人員, occupational: true }
        - { code: F07C,   label: 防疫相關人員, occupational: true }
        - { code: F07D,   label: 禽畜養殖/動物防疫相關行業工作人員, occupational: true }
        - { code: F09,    label: 擴大對象 }
    notes: 第一階段 11 類對象;第二階段 50–64 歲無高風險慢性病成人。潛在疾病證據用附件1 ICD 與重大傷病 ICD(推估)。

    eligibilityGroups:
      # ---------- 第一階段(2026-10-01 起)----------
      - groupId: FLU_HCW
        label: 醫事及衛生等單位之防疫相關人員
        reportCodes: [F07A, F07B, F07C]
        priorityPhase: 1
        criteria: { manual: healthcareWorker }
      - groupId: FLU_ELDER_65
        label: 65 歲以上長者
        reportCodes: [F03A]
        priorityPhase: 1
        criteria: { ageByYear: { min: 65 } }
      - groupId: FLU_INDIGENOUS_55
        label: 55 歲以上原住民
        reportCodes: [F03A]
        priorityPhase: 1
        criteria:
          all:
            - ageByYear: { min: 55 }
            - manual: indigenous
      - groupId: FLU_LTC
        label: 安養、長期照顧(服務)等機構之受照顧者及所屬工作人員
        reportCodes: [F04A, F04B]
        priorityPhase: 1
        criteria: { manual: ltcResident }
      - groupId: FLU_PRESCHOOL
        label: 滿 6 個月以上至國小入學前幼兒
        reportCodes: [F01]
        priorityPhase: 1
        sourceIds: [SRC_CDC_FLU_QA_CHILD]
        criteria:
          all:
            - age: { min: { months: 6 } }        # 足月計,無寬限期(幼兒篇 Q&A)
            - manual: preschoolChild
      - groupId: FLU_PREGNANT
        label: 孕婦
        reportCodes: [F05A]
        priorityPhase: 1
        criteria: { manual: pregnant }
      - groupId: FLU_UNDERLYING
        label: 具潛在疾病者(高風險慢性病、BMI≥30、罕見疾病、重大傷病)
        reportCodes:                             # 依命中的病歷證據決定;醫師手動勾選(含 BMI≥30)則三者擇一
          - { code: F06A, evidence: [FLU_CHRONIC_DX, DIALYSIS_DX, "flag:dialysis", "flag:ckd"] }
          - { code: F06B, evidence: [RARE_DISEASE_DX] }
          - { code: F06C, evidence: [NHI_CATASTROPHIC_DX, NHI_CATASTROPHIC_1Y_DX, NHI_CATASTROPHIC_6M_DX, NHI_CATASTROPHIC_1M_DX] }
        priorityPhase: 1
        sourceIds: [SRC_CDC_FLU_PLAN_115, SRC_CDC_FLU_ANNEX1_115, SRC_NHI_CATASTROPHIC_1140101, SRC_HPA_RARE_1150723]
        criteria:
          all:
            - age: { min: { months: 6 } }        # 計畫第二章肆未設年齡限制;下限取疫苗最小接種年齡(v0.4.3 前為 19–64 歲,漏 15–18 歲非在學者)
            - manual: fluUnderlyingCondition
      - groupId: FLU_INFANT_CAREGIVER
        label: 6 個月內嬰兒之雙親或實際扶養者
        reportCodes: [F05B]
        priorityPhase: 1
        criteria: { manual: infantCaregiver }
      - groupId: FLU_CHILDCARE_STAFF
        label: 幼兒園、托育機構工作人員及居家托育人員(保母)
        reportCodes: [F02B]
        priorityPhase: 1
        criteria: { manual: childcareWorker }
      - groupId: FLU_STUDENT
        label: 國小、國中、高中、高職、五專 1–3 年級學生
        reportCodes: [F02A01, F02A02, F02A03]
        priorityPhase: 1
        criteria: { manual: fluStudent }
      - groupId: FLU_ANIMAL
        label: 禽畜養殖等相關行業工作人員、動物園工作人員及動物防疫人員
        reportCodes: [F07D]
        priorityPhase: 1
        criteria: { manual: animalWorker }
      # ---------- 第二階段(2026-11-02 起)----------
      - groupId: FLU_ADULT_50_64
        label: 50–64 歲成人(無高風險慢性病者第二階段)
        reportCodes: [F03A]
        priorityPhase: 2
        criteria: { ageByYear: { min: 50, max: 64 } }

    dosing:
      seasonal: true
      # 劑次(幼兒篇 Q&A):年齡以本季第 1 劑接種時計;過去接種史 = 本季前累計劑數,不限同一季
      #   未滿 3 歲:累計 0–1 劑 → 本季 2 劑;累計 ≥2 劑 → 1 劑
      #   3 至未滿 9 歲:累計 0 劑 → 本季 2 劑;累計 ≥1 劑 → 1 劑
      #   9 歲以上:1 劑
      variants:
        - id: FLU_UNDER3_2DOSE
          label: 未滿 3 歲、過去累計未滿 2 劑
          sourceRef: SRC_CDC_FLU_QA_CHILD
          age: { max: { years: 2 } }
          priorDoses: { max: 1 }
          series:
            - { dose: 1, minAge: { months: 6 } }
            - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
        - id: FLU_3TO8_NAIVE_2DOSE
          label: 3 至未滿 9 歲、首次接種
          sourceRef: SRC_CDC_FLU_QA_CHILD
          age: { min: { years: 3 }, max: { years: 8 } }
          priorDoses: { max: 0 }
          series:
            - { dose: 1 }
            - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
      series:
        - { dose: 1, minAge: { months: 6 } }

    contraindications:
      - { id: FLU_C_ALLERGY, label: 曾對流感疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }
      - { id: FLU_C_FEVER, label: "急性中重度疾病或發燒,建議延後", severity: precaution, manual: acuteFebrileIllness }

    explain:
      eligible: "符合「{groupLabels}」,本季可打第 {nextDose} 劑(本季共 {dosesRequired} 劑)"
      eligiblePending: "符合「{groupLabels}」;接種史未查,本季是否已打待確認"
      ineligible: "{age},不在 115 年度公費流感對象內"
      completed: "本季已完成(最近一劑 {lastDate})"
      needs_review: "{caseReason}"


  # =====================================================================
  # COVID-19 115–116 年度 — 正式轉譯
  # 依據:115-116年度COVID-19疫苗接種計畫(衛生福利部 115 年 10 月,1151008;與 1150727 版比對,對象與劑次相同)
  # 第一階段 2026-10-01 起 9 類;第二階段 2026-11-02 起 50–64 歲無高風險成人;至疫苗用罄止
  # 年齡:65 歲、55 歲原住民、50–64 歲依「接種年減出生年」(ageByYear,計畫第二章壹一、二、十原文)
  #       從未接種幼兒以「接種年月日減出生年月日」小於 6 歲(age,計畫第二章壹九)
  # 劑次(第五章):滿 6 個月至 4 歲未曾接種 → 2 劑間隔 28 天;其餘 1 劑;曾接種者與前 1 劑間隔 84 天
  # 再增加 1 劑(第二章貳):65 歲以上、55 歲以上原住民、滿 6 個月以上免疫不全或免疫低下者,間隔 180 天
  # 廠牌(不影響資格,本規則不判定):莫德納 mRNA-1273 滿 6 個月、mRNA-1283 滿 12 歲(10/1 起);Novavax 滿 12 歲(10/19 起;1151008 版);已接種其中一種廠牌者無須再接種另一種
  # 後續「視接種情形擴大全國滿 6 個月以上尚未接種者」屬未公告事項,待公告再加群組
  # =====================================================================
  - vaccineId: COVID
    name: { zh: COVID-19 疫苗(115–116 年度公費), en: COVID-19 vaccine 2026–27 (publicly funded) }
    historyMatch: { vaccineCodes: [COVID] }
    season:
      start: "2026-10-01"
      end: "2027-09-30"          # 技術邊界(非公告日期;公告為「至疫苗用罄為止」),用於本季劑數計算
      phases:
        - { phase: 1, start: "2026-10-01", label: 第一階段 }
        - { phase: 2, start: "2026-11-02", label: 第二階段 }
    sourceIds: [SRC_CDC_COVID_PLAN_115]
    reportCodes:                                 # 計畫第二章壹 實施對象 1–10 類;只供面板顯示身分別,不影響資格
      label: 計畫對象類別
      sourceRef: SRC_CDC_COVID_PLAN_115
      note: COVID-19 上傳 NIIS 不需填對象別(計畫第七章肆:疫苗代碼、劑別、批號、型別)
      table:
        - { code: 第1類,  label: 65 歲以上長者 }
        - { code: 第2類,  label: 55 歲以上原住民 }
        - { code: 第3類,  label: 安養、長期照顧(服務)等機構之受照顧者及其所屬工作人員 }
        - { code: 第4類,  label: 孕婦 }
        - { code: 第5類,  label: 滿 6 個月以上高風險對象 }
        - { code: 第6類,  label: 醫事及衛生防疫相關人員 }
        - { code: 第7類,  label: 幼兒園及托育機構工作人員、居家托育人員(保母) }
        - { code: 第8類,  label: 6 個月內嬰兒之雙親或實際扶養者 }
        - { code: 第9類,  label: 從未接種 COVID-19 疫苗之滿 6 個月至未滿 6 歲幼兒 }
        - { code: 第10類, label: 50–64 歲無高風險成人 }
    notes: 第一階段 9 類對象(本規則將免疫低下另立一群以套用再增加 1 劑);第二階段 50–64 歲無高風險成人。高風險對象沿用流感潛在疾病條件,另加結核病、失能、精神疾病、失智症。

    eligibilityGroups:
      # ---------- 第一階段(2026-10-01 起)----------
      - groupId: COVID_ELDER_65
        label: 65 歲以上長者
        reportCodes: [第1類]
        priorityPhase: 1
        criteria: { ageByYear: { min: 65 } }
        dosingOverride: &COVID_PLUS_ONE           # 可再增加 1 劑(計畫第二章貳)
          seasonal: true
          variants:
            - id: COVID_UNDER5_NAIVE_2DOSE_PLUS1
              label: 滿 6 個月至 4 歲未曾接種(2 劑)+ 免疫低下再增加 1 劑
              sourceRef: SRC_CDC_COVID_PLAN_115
              age: { max: { years: 4 } }
              priorDoses: { max: 0 }
              series:
                - { dose: 1, minAge: { months: 6 } }
                - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
                - { dose: 3, minIntervalDays: 180, label: "可再增加 1 劑,與前劑間隔 6 個月以上" }
          series:
            - { dose: 1, minAge: { months: 6 }, minIntervalDays: 84 }
            - { dose: 2, minIntervalDays: 180, label: "可再增加 1 劑,與前劑間隔 6 個月以上" }
      - groupId: COVID_INDIGENOUS_55
        label: 55 歲以上原住民
        reportCodes: [第2類]
        priorityPhase: 1
        criteria:
          all:
            - ageByYear: { min: 55 }
            - manual: indigenous
        dosingOverride: *COVID_PLUS_ONE
      - groupId: COVID_IMMUNOCOMPROMISED
        label: 滿 6 個月以上免疫不全或免疫低下者
        reportCodes: [第5類]   # 計畫未將免疫不全列為獨立類別;第二章壹五高風險含免疫低下,貳另許再增加 1 劑
        priorityPhase: 1
        criteria:
          all:
            - age: { min: { months: 6 } }
            - manual: covidImmunocompromised
        dosingOverride: *COVID_PLUS_ONE
      - groupId: COVID_LTC
        label: 安養、長期照顧(服務)等機構之受照顧者及其所屬工作人員
        reportCodes: [第3類]
        priorityPhase: 1
        criteria: { manual: ltcResident }
      - groupId: COVID_PREGNANT
        label: 孕婦
        reportCodes: [第4類]
        priorityPhase: 1
        criteria: { manual: pregnant }
      - groupId: COVID_HIGHRISK
        label: 滿 6 個月以上高風險對象(流感潛在疾病條件,及結核病、失能、精神疾病、失智症)
        reportCodes: [第5類]
        priorityPhase: 1
        sourceIds: [SRC_CDC_COVID_PLAN_115, SRC_CDC_FLU_ANNEX1_115, SRC_NHI_CATASTROPHIC_1140101, SRC_HPA_RARE_1150723]
        criteria:
          all:
            - age: { min: { months: 6 } }
            - any:
                - manual: fluUnderlyingCondition   # 「符合流感疫苗高風險對象條件」— 與流感共用同一題
                - manual: covidOtherRisk
      - groupId: COVID_HCW
        label: 醫事及衛生防疫相關人員
        reportCodes: [第6類]
        priorityPhase: 1
        criteria: { manual: healthcareWorker }
      - groupId: COVID_CHILDCARE_STAFF
        label: 幼兒園及托育機構工作人員、居家托育人員(保母)
        reportCodes: [第7類]
        priorityPhase: 1
        criteria: { manual: childcareWorker }
      - groupId: COVID_INFANT_CAREGIVER
        label: 6 個月內嬰兒之雙親或實際扶養者
        reportCodes: [第8類]
        priorityPhase: 1
        criteria: { manual: infantCaregiver }
      - groupId: COVID_NAIVE_CHILD
        label: 從未接種 COVID-19 疫苗之滿 6 個月至未滿 6 歲幼兒
        reportCodes: [第9類]
        priorityPhase: 1
        criteria:
          all:
            - age: { min: { months: 6 }, max: { years: 5 } }             # 足月計,未滿 6 歲
            - vaccination: { vaccineCodes: [COVID], maxDoses: 0, before: "2026-10-01" }   # 本季開打前從未接種;本季第 1 劑後仍可打第 2 劑
      # ---------- 第二階段(2026-11-02 起)----------
      - groupId: COVID_ADULT_50_64
        label: 50–64 歲無高風險成人
        reportCodes: [第10類]
        priorityPhase: 2
        criteria: { ageByYear: { min: 50, max: 64 } }

    dosing:
      seasonal: true
      variants:
        - id: COVID_UNDER5_NAIVE_2DOSE
          label: 滿 6 個月至 4 歲、未曾接種 COVID-19 疫苗
          sourceRef: SRC_CDC_COVID_PLAN_115
          age: { max: { years: 4 } }
          priorDoses: { max: 0 }
          series:
            - { dose: 1, minAge: { months: 6 } }
            - { dose: 2, minIntervalDays: 28, label: "與第 1 劑間隔 4 週以上" }
      series:
        - { dose: 1, minAge: { months: 6 }, minIntervalDays: 84 }   # 曾接種者與前 1 劑間隔 12 週(不限本季)

    contraindications:
      - { id: COVID_C_ALLERGY, label: 曾對 COVID-19 疫苗或其成分嚴重過敏, severity: absolute, manual: severeAllergyToVaccine }

    explain:
      eligible: "符合「{groupLabels}」,可打本季第 {nextDose} 劑{doseLabel}"
      eligiblePending: "符合「{groupLabels}」;接種史未查,本季劑數與間隔待確認"
      ineligible: "{age},不在 115–116 年度公費 COVID-19 疫苗對象內"
      completed: "本季已完成(最近一劑 {lastDate})"
      needs_review: "{caseReason}"
