<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>VaxCheck 設定</title>
<link rel="icon" href="icons/icon32.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:15px/1.6 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#1C2B3A;max-width:640px;margin:32px auto;padding:0 20px}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap} h1 img{width:36px;height:36px;flex:none} p.lead{color:#5B6775;margin:0 0 24px}
label{display:block;margin:18px 0 4px;font-weight:700} small{display:block;color:#5B6775;font-weight:400}
select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid #D9DEE4;border-radius:4px;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center;font-weight:400} .row input{width:18px;height:18px}
button{font:inherit;padding:8px 16px;border:0;border-radius:4px;background:#1C2B3A;color:#fff;margin-top:24px;cursor:pointer}
#msg,#rmsg{color:#1E7B4F;margin-left:12px}
.rules{margin-top:18px;padding:10px 12px;background:#F3F5F7;border-radius:4px} .rules button{margin-top:8px;background:#fff;color:#1C2B3A;border:1px solid #1C2B3A} #rmsg.err{color:#B3261E}
#problem{background:#FFF4D6;color:#7A5B00;padding:8px 10px;border-radius:4px;margin:0 0 8px}
input.bad{border-color:#B3261E}
</style></head><body>
<h1><img src="icons/logo-small.svg" alt="">VaxCheck 疫苗檢核 設定 <small id="ver" style="display:inline;font-size:14px;color:#5B6775"></small></h1>
<p class="lead">每台門診電腦設定一次。病患資料不存在這裡。</p>
<label for="jur">適用縣市規則<small>決定載入中央規則,或中央加上縣市擴大對象</small></label>
<select id="jur"></select>
<p id="problem" role="alert" hidden></p>
<label for="medcloud">健保雲端入口網址<small>按標題列圖示時,沒有健保雲端分頁或尚未登入就開這個網址。預設 …/imu/IMUE1000/?type=icc = 實體健保卡自動登入;失效時 15 秒後外掛會代按「實體健保卡」登入鈕</small></label><input type="text" id="medcloud">
<label for="niis">NIIS 查詢頁網址<small>按圖示時在健保雲端右側開背景分頁</small></label><input type="text" id="niis">
<label class="row"><input type="checkbox" id="switch"> 按圖示時自動按健保雲端「請換卡再按我」<small>(實驗功能,預設開;院內發現副作用可關)</small></label>
<label class="row"><input type="checkbox" id="auto"> 按圖示後自動按 NIIS「讀取健保卡及醫事人員卡」<small>(健保雲端讀到本次病患後才按,每次按圖示最多一次;需先在院內確認;預設關閉)</small></label>
<label for="remote">線上規則位址<small>預設 https://raw.githubusercontent.com/Yuchunchen/VaxCheck/rules/ (發行時更新;外掛每天自動檢查一次,也可按下方「立即更新規則」)。留空 = 預設;讀不到、雜湊不符或比內建舊時沿用上次下載的規則或內建規則</small></label>
<input type="text" id="remote" placeholder="留空 = 預設來源">
<label class="row"><input type="checkbox" id="pin"> 只用內建規則(停用線上規則;緊急時鎖定版本)</label>
<div id="rules" class="rules"><b>規則狀態</b><div id="rstat">讀取中…</div>
<button id="refresh" type="button">立即更新規則</button><span id="rmsg"></span></div>
<button id="save">儲存設定</button><span id="msg"></span>
<script src="options.js"></script>
</body></html>
