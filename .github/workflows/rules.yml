name: rules

on:
  push:
    paths: ['rules/**', 'scripts/**', 'package.json', '.github/workflows/rules.yml']
  pull_request:
    paths: ['rules/**', 'scripts/**', 'package.json']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate-rules
      - run: npm run build:rules
      - uses: actions/upload-artifact@v4
        with:
          name: rules-dist
          path: dist/rules/
