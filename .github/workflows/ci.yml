name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run validate-rules
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vaxcheck-dist
          path: |
            dist/ext
            dist/web/index.html
            dist/rules
