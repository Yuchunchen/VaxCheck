name: release
# 發行 vX.Y.Z(X.Y.Z = package.json 版號)→ 驗證、測試、建置 → GitHub Release(外掛 zip、示範頁、SHA256SUMS)
# 兩種觸發:推 tag vX.Y.Z;或 Actions → release → Run workflow(main 分支,由 workflow 在該 commit 建 tag)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 版號(推 tag 時必須等於 package.json)
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "v$V" = "$GITHUB_REF_NAME"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run validate-rules
      - run: npm test
      - run: npm run build
      - name: 發行檔案
        run: |
          cp dist/web/index.html "dist/vaxcheck-web-$V.html"
          (cd dist && sha256sum "vaxcheck-ext-$V.zip" "vaxcheck-web-$V.html" > SHA256SUMS.txt)
          node scripts/release-notes.mjs "$V" > dist/notes.md
      - name: 建立 Release(同版號已發行則失敗)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v$V" "dist/vaxcheck-ext-$V.zip" "dist/vaxcheck-web-$V.html" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "VaxCheck v$V" --notes-file dist/notes.md
      - name: 推送線上規則到 Yuchunchen/VaxCheck-rules(需 secret RULES_PUSH_TOKEN)
        env: { RULES_PUSH_TOKEN: '${{ secrets.RULES_PUSH_TOKEN }}' }
        run: |
          if [ -z "$RULES_PUSH_TOKEN" ]; then echo "::warning::未設定 RULES_PUSH_TOKEN,線上規則未更新(外掛會用內建規則)"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${RULES_PUSH_TOKEN}@github.com/Yuchunchen/VaxCheck-rules.git" rules-repo
          cp dist/rules/manifest.json dist/rules/vaccines.*.json rules-repo/
          cd rules-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VaxCheck v$V 規則 $(node -p "require('../dist/rules/manifest.json').latest.TW.version")"
          git push origin HEAD:main
